name: delta-monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: delta-monitor
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      MONITOR_BASE_DIR: ${{ github.workspace }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行监控
        run: python monitor.py

      - name: 回推结果文件
        run: |
          git config user.name "delta-monitor-bot"
          git config user.email "delta-monitor-bot@users.noreply.github.com"
          git add results.json results_prev.json result.html
          if git rev-parse -q --verify HEAD >/dev/null; then
            git -c commit.gpgsign=false commit --amend --no-edit || true
          else
            git -c commit.gpgsign=false commit -m "monitor results $(date +'%F %T')"
          fi
          git push origin HEAD:main --force

  deploy-pages:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 部署 result.html 到 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
